<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MQTT-Explorer</title>
<style>
  :root { --bg: #f4f2ee; --panel: #fff; --ink: #1d1f21; --muted: #6b6f74; --line: #e2ded6; --accent: #c4531c;
          --ok: #2f7d4f; --bad: #b3261e; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --panel: #212326; --ink: #e8e6e3; --muted: #9a9ea3; --line: #34373b; --accent: #e0703a; --ok: #5cbf85; --bad: #ef6b62; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 18px 24px 8px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; } header h1 span { color: var(--accent); }
  header a { color: var(--muted); font-size: 13px; }
  main { padding: 8px 24px 32px; max-width: 1200px; display: grid; gap: 14px; }
  @media (max-width: 700px) { main, header { padding-left: 12px; padding-right: 12px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, input, select { font: inherit; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  input[type=text] { min-width: 220px; }
  .status { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 6px; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
  td.t { font: 12px var(--mono); color: var(--accent); word-break: break-all; width: 35%; }
  td.p { font: 12px var(--mono); word-break: break-all; }
  td.n { font: 12px var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>MQTT-<span>Explorer</span></h1>
  <a href="monitor.html">→ Monitor</a> <a href="index.html">→ Telnet-Test</a>
</header>
<main>
  <section class="panel">
    <div class="bar">
      <label>Themen <input type="text" id="filter" value="#" title="# = alles, z. B. deye/# für nur Deye"></label>
      <label>Dauer <select id="secs"><option>5</option><option selected>15</option><option>30</option><option>60</option></select> s</label>
      <button class="primary" id="btn">Mitlesen</button>
      <input type="text" id="search" placeholder="Ergebnis filtern, z. B. pv, power, solar">
    </div>
    <p class="status" id="status">Liest für die gewählte Dauer alle Nachrichten am Broker mit (Einstellungen in <code>monitor_config.php</code> → mqtt).</p>
  </section>
  <section class="panel wrap">
    <table><thead><tr><th>Thema</th><th>Letzter Wert</th><th style="text-align:right">Anzahl</th></tr></thead>
    <tbody id="rows"><tr><td colspan="3" class="n" style="text-align:left">Noch nichts gelesen.</td></tr></tbody></table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let last = [];
function render() {
  const q = $('search').value.toLowerCase();
  const rows = last.filter(t => !q || (t.topic + ' ' + t.payload).toLowerCase().includes(q));
  $('rows').innerHTML = rows.length ? rows.map(t => `<tr><td class="t">${esc(t.topic)}</td><td class="p">${esc(t.payload)}</td>
    <td class="n">${t.count}${t.retained ? ' · gespeichert' : ''}</td></tr>`).join('') : '<tr><td colspan="3" class="n" style="text-align:left">Keine Treffer.</td></tr>';
}
$('btn').onclick = async () => {
  const secs = $('secs').value;
  $('btn').disabled = true; $('status').className = 'status'; $('status').textContent = `Lese ${secs} s mit …`;
  try {
    const r = await (await fetch(`api.php?action=mqtt_scan&secs=${secs}&filter=${encodeURIComponent($('filter').value)}`)).json();
    if (!r.ok) { $('status').className = 'status bad'; $('status').textContent = r.error; return; }
    last = r.topics; render();
    $('status').className = 'status ok'; $('status').textContent = `${r.topics.length} Themen von ${r.broker} in ${r.secs} s.`;
  } catch (e) { $('status').className = 'status bad'; $('status').textContent = e.message; }
  finally { $('btn').disabled = false; }
};
$('search').oninput = render;
</script>
</body>
</html>
